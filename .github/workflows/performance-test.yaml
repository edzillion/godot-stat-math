name: Test Performance Integration

on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: 'Commit performance results back to repo'
        required: false
        default: true
        type: boolean

jobs:
  trigger-runner:
    runs-on: ubuntu-latest
    outputs:
      runner-triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Trigger AWS Runner
        id: trigger
        run: |
          echo "Triggering AWS runner for performance integration test..."
          response=$(curl -s -X POST "${{ secrets.LAMBDA_FUNCTION_URL }}")
          echo "Response: $response"
          
          if echo "$response" | grep -q "launched successfully"; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "✅ Runner launched successfully"
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
            echo "❌ Failed to launch runner"
            exit 1
          fi
          
      - name: Wait for runner
        run: |
          echo "Waiting 30 seconds for runner to come online..."
          sleep 30

  test-and-commit:
    needs: trigger-runner
    runs-on: [self-hosted, linux, x64]
    if: needs.trigger-runner.outputs.runner-triggered == 'true'
    env:
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
    timeout-minutes: 60
    permissions:
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        
      - name: System info
        run: |
          echo "=== Performance Integration Test Environment ==="
          echo "Timestamp: $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)"
          echo "Instance Type: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)"
          echo "CPU Cores: $(nproc)"
          echo "Memory: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "==============================================="

      - name: Extract version
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: project.godot
          version-regex: config\/version=\"\K[0-9.\-A-z]*
        id: extract-version
          
      - name: Run GDUnit4 tests (including performance tests)
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4"
          paths: "res://addons/godot-stat-math/tests"
          upload-report: false

      - name: Check performance results
        run: |
          echo "Checking for performance test results..."
          RESULTS_DIR="addons/godot-stat-math/tests/performance/results"
          
          if [ -d "$RESULTS_DIR" ]; then
            echo "✅ Performance results directory exists"
            ls -la "$RESULTS_DIR"
            
            if [ -f "$RESULTS_DIR/latest.json" ]; then
              echo "✅ latest.json found"
              echo "File size: $(stat -c%s "$RESULTS_DIR/latest.json") bytes"
            else
              echo "❌ latest.json not found"
            fi
            
            # Count result files
            PASS_FILES=$(find "$RESULTS_DIR" -name "pass_*.json" | wc -l)
            FAIL_FILES=$(find "$RESULTS_DIR" -name "fail_*.json" | wc -l)
            echo "📊 Performance snapshots: $PASS_FILES pass, $FAIL_FILES fail"
          else
            echo "❌ Performance results directory not found"
          fi

      - name: Commit GDUnit4 test reports
        if: github.event.inputs.commit_results == 'true'
        run: |
          echo "Committing GDUnit4 test reports..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d "reports" ]; then
            git add reports/
            if git diff --staged --quiet; then
              echo "No test report changes to commit"
            else
              TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
              COMMIT_MSG="📊 GDUnit4 test reports - $TIMESTAMP"
              git commit -m "$COMMIT_MSG"
              git push origin ${{ github.ref_name }}
              echo "✅ Test reports committed and pushed"
            fi
          else
            echo "❌ No reports directory found to commit"
          fi

      - name: Generate test summary
        run: |
          echo "## 🧪 Performance Integration Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.extract-version.outputs.version-string }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance Type**: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Reports Committed**: ${{ github.event.inputs.commit_results }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 This test validates the complete workflow: AWS spot instances → GDUnit4 tests → test reports → commit back to repo" >> $GITHUB_STEP_SUMMARY