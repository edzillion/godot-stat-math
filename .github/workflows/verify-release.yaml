name: "Verify Release"

on:
  pull_request:
    branches: ["release"]
    types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FILE: project.godot
  VERSION_REGEX: config\/version=\"\K[0-9.\-A-z]*

jobs:
  enforce-develop-source:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR is from develop branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ PRs to release must come from develop branch. This PR is from '${{ github.head_ref }}'."
            exit 1
          fi
          echo "✅ PR is from develop branch."

  check-version-bump:
    needs: enforce-develop-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Extract old version string
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version-old

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Extract new version string
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version-new

      - name: Check semantic version bump
        uses: CapsCollective/version-actions/check-version-bump@v1.0
        with:
          new-version: ${{ steps.extract-version-new.outputs.version-string }}
          old-version: ${{ steps.extract-version-old.outputs.version-string }}

  validate-addon-structure:
    needs: [enforce-develop-source, check-version-bump]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate addon structure
        run: |
          echo "Validating addon structure..."
          
          # Check required files exist
          if [[ ! -f "addons/godot-stat-math/plugin.cfg" ]]; then
            echo "❌ Missing plugin.cfg"
            exit 1
          fi
          
          if [[ ! -f "addons/godot-stat-math/stat_math.gd" ]]; then
            echo "❌ Missing main stat_math.gd file"
            exit 1
          fi
          
          # Validate plugin.cfg format
          if ! grep -q "script=\"godot_stat_math.gd\"" addons/godot-stat-math/plugin.cfg; then
            echo "❌ plugin.cfg missing or malformed script reference"
            exit 1
          fi
          
          echo "✅ Addon structure validation passed"

  trigger-runner:
    needs: [enforce-develop-source, check-version-bump, validate-addon-structure]
    runs-on: ubuntu-latest
    outputs:
      runner-triggered: ${{ steps.trigger.outputs.triggered }}
      instance-id: ${{ steps.trigger.outputs.instance-id }}
    steps:
      - name: Trigger AWS Runner
        id: trigger
        run: |
          if [ -z "${{ secrets.LAMBDA_FUNCTION_URL }}" ]; then
            echo "❌ LAMBDA_FUNCTION_URL secret is not set"
            exit 1
          fi
          
          echo "Triggering AWS runner..."
          echo "Lambda URL: ${{ secrets.LAMBDA_FUNCTION_URL }}"
          
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ secrets.LAMBDA_FUNCTION_URL }}")
          echo "Response: $response"
          
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          if [ "$http_code" = "200" ] && echo "$body" | grep -q "launched successfully"; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            instance_id=$(echo "$body" | jq -r '.instance_id' 2>/dev/null || echo 'N/A')
            echo "instance-id=$instance_id" >> $GITHUB_OUTPUT
            echo "✅ Runner launched successfully"
            echo "Instance ID: $instance_id"
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
            echo "❌ Failed to launch runner"
            echo "HTTP Code: $http_code"
            echo "Response Body: $body"
            exit 1
          fi
          
      - name: Wait for runner
        run: |
          echo "Waiting 60 seconds for runner to come online..."
          echo "⏳ Spot instance starting up..."
          sleep 60
          echo "✅ Proceeding to job execution"

  run-tests:
    needs: [enforce-develop-source, check-version-bump, validate-addon-structure, trigger-runner]
    runs-on: [self-hosted, linux, x64]
    if: needs.trigger-runner.outputs.runner-triggered == 'true'
    permissions:
      checks: write
      actions: read
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System info
        run: |
          echo "=== Release Verification Environment ==="
          echo "PR Number: ${{ github.event.number }}"
          echo "Target Branch: ${{ github.base_ref }}"
          echo "Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)"
          echo "Instance Type: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)"
          echo "CPU Cores: $(nproc)"
          echo "========================================"

      - name: Clean up previous reports
        run: rm -rf reports

      - name: Run Unit Tests
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4"
          paths: |
            res://addons/godot-stat-math/tests/core
            res://addons/godot-stat-math/tests/stat_math_test.gd
          publish-report: false
          upload-report: false
          report-name: "unit-tests.xml"
        env:
          DISABLE_REGRESSION_CHECKING: false

      - name: Clean up GdUnit4 installation artifacts
        if: always()
        run: |
          echo "Cleaning up GdUnit4 installation artifacts..."
          rm -rf ./.install-gdunit4
          rm -rf ./addons/gdUnit4
          echo "✅ Cleanup completed"

      - name: Run Performance Tests
        if: always()
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4"
          paths: "res://addons/godot-stat-math/tests/performance"
          publish-report: false
          upload-report: false
          report-name: "performance-tests.xml"
        env:
          DISABLE_REGRESSION_CHECKING: false

      - name: Check test completion and results
        if: always()
        id: test-results
        run: |
          echo "=== Test Results Analysis ==="
          
          # Default to failed state
          echo "tests-passed=false" >> $GITHUB_OUTPUT
          
          if [ -d "reports" ]; then
            echo "✅ Reports directory exists"
            
            # Find latest report directory
            LATEST_REPORT=$(find reports -type d -name "report_*" | sort -V | tail -1)
            
            if [ -n "$LATEST_REPORT" ]; then
              echo "📁 Latest report: $LATEST_REPORT"
              
              # Check for results.xml
              if [ -f "$LATEST_REPORT/results.xml" ]; then
                echo "📊 Found results.xml"
                
                # Correctly parse only the first failures/errors value (summary)
                FAILURES=$(grep -o 'failures="[0-9]*"' "$LATEST_REPORT/results.xml" | grep -o '[0-9]*' | head -1 || echo "0")
                ERRORS=$(grep -o 'errors="[0-9]*"' "$LATEST_REPORT/results.xml" | grep -o '[0-9]*' | head -1 || echo "0")
                echo "Failures: $FAILURES, Errors: $ERRORS"
                
                if [ "$FAILURES" = "0" ] && [ "$ERRORS" = "0" ]; then
                  echo "✅ Tests completed successfully with no failures"
                  echo "tests-passed=true" >> $GITHUB_OUTPUT
                else
                  echo "❌ Tests completed but with $FAILURES failures and $ERRORS errors"
                  echo "tests-passed=false" >> $GITHUB_OUTPUT
                fi
                
                # Show test summary
                echo "Test summary from results.xml:"
                grep -E "(tests=|failures=|skipped=|errors=)" "$LATEST_REPORT/results.xml" || true
              else
                echo "❌ No results.xml found in $LATEST_REPORT"
                echo "Contents:"
                ls -la "$LATEST_REPORT"
                echo "tests-passed=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "❌ No report_* directories found"
              echo "Reports directory contents:"
              ls -la reports/
              echo "tests-passed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ No reports directory found"
            echo "Root directory contents:"
            ls -la
            echo "tests-passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results (failures only)
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-FAILED-pr-${{ github.event.number }}
          path: reports/
          if-no-files-found: warn
        if: always() && steps.test-results.outputs.tests-passed == 'false'

      - name: Debug XML file locations
        if: always()
        run: |
          echo "=== Debugging XML File Locations ==="
          echo "Python version: $(python3 --version)"
          echo "Current directory: $(pwd)"
          echo "Making debug script executable..."
          chmod +x scripts/find_xml_reports.py
          echo "Running XML file location debug..."
          python3 scripts/find_xml_reports.py

      - name: Generate badge data
        if: always()
        run: |
          echo "=== Generating Badge Data ==="
          echo "Current directory: $(pwd)"
          echo "Making script executable..."
          chmod +x scripts/extract_badge_data.py
          echo "Running badge data extraction..."
          python3 scripts/extract_badge_data.py

      - name: Set up SSH for deploy key
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY_FOR_ACTIONS }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Commit badge data and reports
        if: always()
        run: |
          echo "=== Committing Badge Data and Test Reports ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add badge data if it exists
          if [ -d "docs/_static/badges" ]; then
            echo "Badge directory exists, adding to staging..."
            git add docs/_static/badges/
          else
            echo "⚠️ No badge data directory found"
          fi
          
          # Add reports directory if it exists
          REPORTS_DIR="reports"
          if [ -d "$REPORTS_DIR" ]; then
            echo "Reports directory exists, adding to staging..."
            git add "$REPORTS_DIR/"
            echo "📁 Reports directory contents:"
            find "$REPORTS_DIR" -type f -name "*.xml" | head -10
          else
            echo "⚠️ No reports directory found"
          fi
          
          # Check if there are any changes to commit
          if ! git diff --staged --quiet; then
            echo "Changes detected, committing..."
            git commit -m "📊 Update badge data and test reports - Release verification"
            
            # Push to source branch (develop) - updates the PR
            echo "Pushing badge data and reports to source branch: ${{ github.head_ref }}"
            git push git@github.com:${{ github.repository }}.git HEAD:${{ github.head_ref }}
            
            echo "✅ Badge data and test reports updated and pushed to PR branch"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Generate verification summary
        if: always()
        run: |
          if [ "${{ steps.test-results.outputs.tests-passed }}" = "true" ]; then
            echo "## ✅ Release Verification Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version Bump**: Validated" >> $GITHUB_STEP_SUMMARY
            echo "- **Addon Structure**: Valid" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests**: ✅ Passed on AWS Spot Instance" >> $GITHUB_STEP_SUMMARY
            echo "- **Instance Type**: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Reports**: Not uploaded (tests passed)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 Ready to merge and release!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Release Verification Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version Bump**: Validated" >> $GITHUB_STEP_SUMMARY
            echo "- **Addon Structure**: Valid" >> $GITHUB_STEP_SUMMARY
            echo "- **Tests**: ❌ Failed on AWS Spot Instance" >> $GITHUB_STEP_SUMMARY
            echo "- **Instance Type**: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)" >> $GITHUB_STEP_SUMMARY
            echo "- **Test Reports**: 📁 Uploaded as artifact for investigation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔧 Fix test failures before merging!" >> $GITHUB_STEP_SUMMARY
          fi

  terminate-runner:
    runs-on: ubuntu-latest
    needs: [enforce-develop-source, trigger-runner, run-tests]
    if: always() && needs.trigger-runner.outputs.runner-triggered == 'true'
    steps:
      - name: Terminate spot instance
        run: |
          INSTANCE_ID="${{ needs.trigger-runner.outputs.instance-id }}"
          echo "Terminating spot instance: $INSTANCE_ID"
          
          if [ "$INSTANCE_ID" = "N/A" ] || [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ No valid instance ID found, skipping termination"
            exit 0
          fi
          
          # Terminate the instance
          aws ec2 terminate-instances --instance-ids $INSTANCE_ID
          echo "✅ Spot instance $INSTANCE_ID termination requested"
          
          # Wait a moment and check status
          sleep 10
          aws ec2 describe-instances --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].State.Name' --output text
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-west-1' }}

      - name: Cleanup summary
        run: |
          INSTANCE_ID="${{ needs.trigger-runner.outputs.instance-id }}"
          echo "## 🔧 Spot Instance Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: $INSTANCE_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Termination requested ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Tests Job**: ${{ needs.run-tests.result }}" >> $GITHUB_STEP_SUMMARY
