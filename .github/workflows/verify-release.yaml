name: "Verify Release"

on:
  pull_request:
    branches: ["release"]
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FILE: project.godot
  VERSION_REGEX: config\/version=\"\K[0-9.\-A-z]*

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Extract old version string
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version-old

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Extract new version string
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version-new

      - name: Check semantic version bump
        uses: CapsCollective/version-actions/check-version-bump@v1.0
        with:
          new-version: ${{ steps.extract-version-new.outputs.version-string }}
          old-version: ${{ steps.extract-version-old.outputs.version-string }}

  validate-addon-structure:
    needs: check-version-bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate addon structure
        run: |
          echo "Validating addon structure..."
          
          # Check required files exist
          if [[ ! -f "addons/godot-stat-math/plugin.cfg" ]]; then
            echo "❌ Missing plugin.cfg"
            exit 1
          fi
          
          if [[ ! -f "addons/godot-stat-math/stat_math.gd" ]]; then
            echo "❌ Missing main stat_math.gd file"
            exit 1
          fi
          
          # Validate plugin.cfg format
          if ! grep -q "script=\"godot_stat_math.gd\"" addons/godot-stat-math/plugin.cfg; then
            echo "❌ plugin.cfg missing or malformed script reference"
            exit 1
          fi
          
          echo "✅ Addon structure validation passed"

  trigger-runner:
    needs: [check-version-bump, validate-addon-structure]
    runs-on: ubuntu-latest
    outputs:
      runner-triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Trigger AWS Runner
        id: trigger
        run: |
          if [ -z "${{ secrets.LAMBDA_FUNCTION_URL }}" ]; then
            echo "❌ LAMBDA_FUNCTION_URL secret is not set"
            exit 1
          fi
          
          echo "Triggering AWS runner..."
          echo "Lambda URL: ${{ secrets.LAMBDA_FUNCTION_URL }}"
          
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ secrets.LAMBDA_FUNCTION_URL }}")
          echo "Response: $response"
          
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          if [ "$http_code" = "200" ] && echo "$body" | grep -q "launched successfully"; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "✅ Runner launched successfully"
            echo "Instance ID: $(echo "$body" | jq -r '.instance_id' 2>/dev/null || echo 'N/A')"
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
            echo "❌ Failed to launch runner"
            echo "HTTP Code: $http_code"
            echo "Response Body: $body"
            exit 1
          fi
          
      - name: Wait for runner
        run: |
          echo "Waiting 60 seconds for runner to come online..."
          echo "⏳ Spot instance starting up..."
          sleep 60
          echo "✅ Proceeding to job execution"

  run-tests:
    needs: [check-version-bump, validate-addon-structure, trigger-runner]
    runs-on: [self-hosted, linux, x64]
    if: needs.trigger-runner.outputs.runner-triggered == 'true'
    permissions:
      checks: write
      actions: read
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System info
        run: |
          echo "=== Release Verification Environment ==="
          echo "PR Number: ${{ github.event.number }}"
          echo "Target Branch: ${{ github.base_ref }}"
          echo "Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)"
          echo "Instance Type: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)"
          echo "CPU Cores: $(nproc)"
          echo "========================================"

      - name: Clean up previous reports
        run: rm -rf reports

      - name: Run All GDUnit4 tests
        run: |
          echo "Running GDUnit4 tests using custom command..."
          # Use the same command pattern from your memory
          timeout 120 ./addons/gdUnit4/runtest.cmd --godot_bin "godot" -a "res://addons/godot-stat-math/tests/core" || true
          
          echo "Test execution completed, checking for results..."
          if [ -d "reports" ]; then
            echo "Reports directory found:"
            find reports -type f -name "*.xml" -o -name "*.html" | head -10
          else
            echo "No reports directory found"
          fi

      - name: Debug reports directory
        run: |
          echo "=== Debugging Reports Directory ==="
          if [ -d "reports" ]; then
            echo "Reports directory contents:"
            ls -la reports/ || true
            echo "Looking for XML files:"
            find reports -name "*.xml" -type f 2>/dev/null || echo "No XML files found"
            echo "Looking for HTML files:"  
            find reports -name "*.html" -type f 2>/dev/null || echo "No HTML files found"
          else
            echo "Reports directory does not exist"
          fi
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-pr-${{ github.event.number }}
          path: |
            reports/**/*.xml
            reports/**/*.html
            reports/**/results.xml
          if-no-files-found: warn
        if: always()

      - name: Generate verification summary
        run: |
          echo "## ✅ Release Verification Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Bump**: Validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Addon Structure**: Valid" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: Passed on AWS Spot Instance" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance Type**: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Ready to merge and release!" >> $GITHUB_STEP_SUMMARY
