name: "Build Develop"

on:
  push:
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FILE: project.godot
  VERSION_REGEX: config\/version=\"\K[0-9.\-A-z]*

jobs:
  trigger-runner:
    runs-on: ubuntu-latest
    outputs:
      runner-triggered: ${{ steps.trigger.outputs.triggered }}
    steps:
      - name: Trigger AWS Runner
        id: trigger
        run: |
          if [ -z "${{ secrets.LAMBDA_FUNCTION_URL }}" ]; then
            echo "❌ LAMBDA_FUNCTION_URL secret is not set"
            exit 1
          fi
          
          echo "Triggering AWS runner..."
          echo "Lambda URL: ${{ secrets.LAMBDA_FUNCTION_URL }}"
          
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ secrets.LAMBDA_FUNCTION_URL }}")
          echo "Response: $response"
          
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')
          
          if [ "$http_code" = "200" ] && echo "$body" | grep -q "launched successfully"; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "✅ Runner launched successfully"
            echo "Instance ID: $(echo "$body" | jq -r '.instance_id' 2>/dev/null || echo 'N/A')"
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
            echo "❌ Failed to launch runner"
            echo "HTTP Code: $http_code"
            echo "Response Body: $body"
            exit 1
          fi
          
      - name: Wait for runner
        run: |
          echo "Waiting 60 seconds for runner to come online..."
          echo "⏳ Spot instance starting up..."
          sleep 60
          echo "✅ Proceeding to job execution"

  build-addon:
    needs: trigger-runner
    runs-on: [self-hosted, linux, x64]
    if: needs.trigger-runner.outputs.runner-triggered == 'true'
    permissions:
      checks: write
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Synchronize with remote branch
        run: |
          echo "Pulling latest changes for branch ${{ github.ref_name }}..."
          git pull origin ${{ github.ref_name }}

      - name: System info
        run: |
          echo "=== Develop Build Environment ==="
          echo "Timestamp: $(date)"
          echo "Commit: ${{ github.sha }}"
          echo "Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)"
          echo "Instance Type: $(curl -s http://169.254.169.254/latest/meta-data/instance-type)"
          echo "CPU Cores: $(nproc)"
          echo "================================="

      - name: Extract version
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version

      - name: Clean up previous reports
        run: rm -rf reports

      - name: Run All GDUnit4 tests
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4"
          paths: "res://addons/godot-stat-math/tests"
          upload-report: false
        env:
          DISABLE_REGRESSION_CHECKING: true

      - name: Commit test and performance results
        run: |
          echo "Committing GDUnit4 test and performance results..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPORTS_DIR="reports"
          PERF_RESULTS_DIR="addons/godot-stat-math/tests/performance/results"

          # Add both directories if they exist
          if [ -d "$REPORTS_DIR" ]; then
            git add "$REPORTS_DIR/"
          fi
          if [ -d "$PERF_RESULTS_DIR" ]; then
            git add "$PERF_RESULTS_DIR/"
          fi

          if git diff --staged --quiet; then
            echo "No new test results to commit"
          else
            COMMIT_MSG="📊 Test Results - ${{ github.workflow }} ${{ github.run_number }}"
            
            git commit -m "$COMMIT_MSG"
            git push origin ${{ github.ref_name }}
            echo "✅ Test reports and performance results committed and pushed"
          fi

      - name: Create addon zip
        run: |
          echo "Creating addon zip for version ${{ steps.extract-version.outputs.version-string }}"
          cd addons
          zip -r ../godot-stat-math-${{ steps.extract-version.outputs.version-string }}-dev.zip godot-stat-math/ -x "*.uid"
          
          # Create a short commit hash for identification
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          
          echo "Created: godot-stat-math-${{ steps.extract-version.outputs.version-string }}-dev.zip"
          echo "Commit: ${SHORT_SHA}"
          
          # List contents for verification
          echo "Zip contents:"
          zipinfo ../godot-stat-math-${{ steps.extract-version.outputs.version-string }}-dev.zip

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-stat-math-dev-build
          path: "godot-stat-math-*-dev.zip"
          retention-days: 14
          if-no-files-found: error
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: develop-build-test-results-${{ github.run_number }}
          path: reports/
        if: always()

      - name: Generate build summary
        run: |
          echo "## 🔧 Development Build Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.extract-version.outputs.version-string }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: godot-stat-math-${{ steps.extract-version.outputs.version-string }}-dev.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the artifact from the **Actions** tab to test this build." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ This is a development build - not for production use." >> $GITHUB_STEP_SUMMARY
