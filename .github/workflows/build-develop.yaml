name: "Build Release"

on:
  push:
    branches: ["release"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FILE: project.godot
  VERSION_REGEX: config\/version=\"\K[0-9.\-A-z]*
  RELEASE_DEBUG_DIST: false
  RELEASE_VERSION_OVERRIDE: ""  # Set this to override version, e.g. 1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      actions: read
      contents: write
    strategy:
      matrix:
        include:
          - distribution: standard
            include_tests: false
            suffix: ""
            edition_name: "Standard"
          - distribution: debug
            include_tests: true
            suffix: "-debug"
            edition_name: "Debug"
    steps:
      - name: Skip debug build if not enabled
        if: ${{ matrix.distribution == 'debug' && env.RELEASE_DEBUG_DIST != 'true' }}
        run: |
          echo "Skipping debug build because RELEASE_DEBUG_DIST is not true"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current version
        id: get_version
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.VERSION_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}

      - name: Extract release notes from CHANGELOG
        run: |
          git checkout ${{ github.ref_name }}

      - name: Bump develop version if needed
        id: bump-version
        run: |
          DEV_VERSION="${{ steps.extract-version.outputs.version-number }}"
          REL_VERSION="${{ steps.extract-release-version.outputs.version-number }}"
          NEW_VERSION="$DEV_VERSION"
          BUMPED=false
          
          echo "Current develop version: $DEV_VERSION"
          echo "Current release version: $REL_VERSION"
          
          # Compare versions - bump if develop <= release
          if [ "$DEV_VERSION" = "$REL_VERSION" ]; then
            echo "Version bump needed - develop version equals release version"
            if [ -n "${{ env.RELEASE_VERSION_OVERRIDE }}" ]; then
              NEW_VERSION="${{ env.RELEASE_VERSION_OVERRIDE }}"
              echo "Overriding version to $NEW_VERSION"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$DEV_VERSION"
              PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$PATCH"
              echo "Auto-bumping develop version to $NEW_VERSION"
            fi
            
            # Update the version in both files
            sed -i "s/config\/version=\"[^\"]*\"/config\/version=\"$NEW_VERSION\"/" ${{ env.VERSION_FILE }}
            sed -i "s/version=\"[^\"]*\"/version=\"$NEW_VERSION\"/" addons/godot-stat-math/plugin.cfg
            
            # Commit and push the change
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add ${{ env.VERSION_FILE }}
            git add addons/godot-stat-math/plugin.cfg
            git commit -m "chore: bump develop version to $NEW_VERSION"
            git push origin ${{ github.ref_name }}
            BUMPED=true
          else
            echo "No version bump needed - develop version is already ahead of release"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bumped=$BUMPED" >> $GITHUB_OUTPUT

      - name: Clean up previous reports
        run: rm -rf reports

      - name: Run All GDUnit4 tests
        uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: "4.4"
          paths: "res://addons/godot-stat-math/tests"
          upload-report: false
        env:
          DISABLE_REGRESSION_CHECKING: true

      - name: Commit test and performance results
        run: |
          echo "Creating ${{ matrix.edition_name }} release zip for Godot Stat Math ${{ steps.get_version.outputs.version-string }}"
          cd addons
          if [ "${{ matrix.include_tests }}" == "false" ]; then
            zip -r ../godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip godot-stat-math/ \
              -x "*.uid" "*.tmp" "*.import~" "*.remap~" "*~" \
              "*.DS_Store" "*.DS_Store?" "*._*" "*.Spotlight-V100" "*.Trashes" \
              "*ehthumbs.db" "*Thumbs.db" \
              "godot-stat-math/tests/*"
          else
            zip -r ../godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip godot-stat-math/ \
              -x "*.uid" "*.tmp" "*.import~" "*.remap~" "*~" \
              "*.DS_Store" "*.DS_Store?" "*._*" "*.Spotlight-V100" "*.Trashes" \
              "*ehthumbs.db" "*Thumbs.db"
          fi
          echo "${{ matrix.edition_name }} release zip contents:"
          zipinfo ../godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip
          FILE_SIZE=$(stat -c%s ../godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip)
          echo "Zip file size: ${FILE_SIZE} bytes"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.get_version.outputs.version-string }}
          name: Godot Stat Math ${{ steps.get_version.outputs.version-string }}
          bodyFile: release_notes.md
          artifacts: "godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip"
          draft: false
          prerelease: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          updateOnlyUnreleased: false

      - name: Generate build summary
        run: |
          echo "## 🚀 ${{ matrix.edition_name }} Edition Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.get_version.outputs.version-string }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution**: ${{ matrix.edition_name }} Edition" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.get_version.outputs.version-string }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: GitHub Hosted (ubuntu-latest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: godot-stat-math-${{ steps.get_version.outputs.version-string }}${{ matrix.suffix }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.include_tests }}" == "true" ]; then
            echo "📦 **Debug Edition**: Includes full test suite and performance benchmarks for troubleshooting" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **Standard Edition**: Production-ready, optimized for end users" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Release is now available on the [Releases page](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY

  build-and-publish-docs:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Publish Sphinx Docs to GitHub Pages
        uses: totaldebug/sphinx-publish-action@1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sphinx_src: 'docs'
          target_branch: 'gh-pages'
          pre_build_commands: |
            pip install sphinx_rtd_theme
            echo "Building docs with version: $(python -c \"exec(open('docs/conf.py').read()); print(release)\")" 
