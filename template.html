<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Data Charts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 20px;
            line-height: 1.6;
        }
        .perf-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            padding: 8px;
            background-color: #2a2a2a;
            border-radius: 4px;
        }
        .function-name {
            width: 400px;
            font-weight: bold;
            color: #4a9eff;
        }
        .current-time {
            width: 80px;
            text-align: right;
            color: #ffd700;
            margin-right: 20px;
        }
        .chart-container {
            width: 200px;
            height: 50px;
        }
        h1 {
            color: #4a9eff;
            border-bottom: 2px solid #4a9eff;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Math Library Performance Data</h1>
    <div id="performance-data"></div>

    <script>
        // Sample performance data - replace with your actual data
        const performanceData = [
            {
                name: "errorfunctions_complementary_error_function",
                currentTime: 0.4068,
                history: [0.42, 0.39, 0.41, 0.40, 0.4068]
            },
            {
                name: "vector_operations_dot_product",
                currentTime: 0.1234,
                history: [0.13, 0.12, 0.125, 0.121, 0.1234]
            },
            {
                name: "matrix_operations_multiply_4x4",
                currentTime: 0.8956,
                history: [0.91, 0.88, 0.92, 0.87, 0.8956]
            },
            {
                name: "trigonometry_sine_cosine_batch",
                currentTime: 0.2345,
                history: [0.24, 0.23, 0.235, 0.238, 0.2345]
            }
        ];

        function createInlineChart(containerId, data) {
            const ctx = document.getElementById(containerId).getContext('2d');
            const average = data.reduce((a, b) => a + b, 0) / data.length;
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['T-4', 'T-3', 'T-2', 'T-1', 'Current'],
                    datasets: [
                        {
                            label: 'Performance',
                            data: data,
                            borderColor: '#4a9eff',
                            backgroundColor: 'rgba(74, 158, 255, 0.1)',
                            borderWidth: 2,
                            pointRadius: 3,
                            pointBackgroundColor: '#4a9eff',
                            tension: 0.1
                        },
                        {
                            label: 'Average',
                            data: Array(data.length).fill(average),
                            borderColor: '#ff6b6b',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            display: false,
                            beginAtZero: false
                        }
                    },
                    elements: {
                        point: {
                            hoverRadius: 4
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // Generate the performance display
        const container = document.getElementById('performance-data');
        
        performanceData.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'perf-row';
            
            const chartId = `chart-${index}`;
            row.innerHTML = `
                <div class="function-name">${item.name}</div>
                <div class="current-time">${item.currentTime.toFixed(4)}</div>
                <div class="chart-container">
                    <canvas id="${chartId}"></canvas>
                </div>
            `;
            
            container.appendChild(row);
            
            // Create chart after DOM element is added
            setTimeout(() => createInlineChart(chartId, item.history), 0);
        });
    </script>
</body>
</html>
